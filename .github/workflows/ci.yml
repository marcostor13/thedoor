name: CI

# En main no corre: allí manda Deploy, que compila y prueba lo mismo antes de
# tocar producción. Así un push a main no paga dos veces el mismo build.
on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:web
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Build backend
        run: bun run build:api

      - name: Tests
        run: bun run test
