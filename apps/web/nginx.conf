server {
    listen 80;
    # El entrypoint de la imagen (10-listen-on-ipv6-by-default.sh) solo añade
    # esta línea al default.conf que trae de fábrica: como montamos el nuestro,
    # detecta que difiere y no lo toca. Sin ella nginx solo atiende IPv4 y
    # cualquier sonda que resuelva `localhost` a ::1 recibe connection refused.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS y cabeceras de proxy las gestiona Coolify (Traefik) por delante.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Los activos con hash en el nombre son inmutables.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML se revalida siempre: es lo que apunta a los activos con hash.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
