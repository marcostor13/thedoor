<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The Door PR — puerta de medio punto entreabierta al 50 %, misma
       anatomía que DoorGlyph.astro simplificada para leerse a 16 px. -->
  <defs>
    <linearGradient id="fv-light" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff1a25" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff3ec"/>
      <stop offset="1" stop-color="#ff5560" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="fv-clip">
      <path d="M7 29V13a9 9 0 0 1 18 0v16Z"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" fill="#000"/>

  <!-- Luz del otro lado -->
  <g clip-path="url(#fv-clip)">
    <rect x="7" y="4" width="18" height="25" fill="url(#fv-light)"/>
  </g>

  <!-- Hojas entreabiertas -->
  <path d="M8 28.4V14h4.4v14.4Z" fill="#000"/>
  <path d="M24 28.4V14h-4.4v14.4Z" fill="#000"/>

  <g fill="none" stroke="#ff1a25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 29.5V13a12.5 12.5 0 0 1 25 0v16.5" stroke-width="2"/>
    <path d="M7 29V13a9 9 0 0 1 18 0v16" stroke-width="1.2" opacity=".85"/>
    <path d="M6 13h20" stroke-width="1.2"/>
    <path d="M8 28.4V14h4.4v14.4M24 28.4V14h-4.4v14.4" stroke-width="1.1"/>
    <g stroke-width=".9" opacity=".8">
      <path d="M16 13V6M16 13l5-4.9M16 13l-5-4.9"/>
    </g>
  </g>

  <!-- Derrame en el suelo -->
  <path d="M6 29.4h20" stroke="#ff5560" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
</svg>
